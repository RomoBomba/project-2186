id: philosophy.consciousness
domain: philosophy

title:
  ru: 'Сознание'
  en: 'Consciousness'

aliases:
  ru:
    - 'сознание'
    - 'что такое сознание'
    - 'природа сознания'
    - 'субъективный опыт'
    - 'внутренний опыт'
    - 'может ли машина иметь сознание'
    - 'искусственное сознание'
    - 'машинное сознание'
  en:
    - 'consciousness'
