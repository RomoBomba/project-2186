id: philosophy.freedom
domain: philosophy

title:
  ru: 'Свобода'
  en: 'Freedom'

aliases:
  ru:
    - 'свобода'
    - 'свобода воли'
    - 'свободная воля'
    - 'свободный выбор'
    - 'свобода выбора'
    - 'быть свободным'
    - 'что делает человека свободным'
    - 'могу ли я выбирать свободно'
    - 'выбор и ответственность'
  en:
    - 'freedom'
    - 'free will'
    - 'free choice'
    - 'freedom of choice'
    - 'being free'
