id: philosophy.knowledge
domain: philosophy

title:
  ru: 'Знание'
  en: 'Knowledge'

aliases:
  ru:
    - 'знание'
    - 'что значит знать'
    - 'что такое знание'
    - 'знать наверняка'
    - 'можно ли знать наверняка'
    - 'достоверное знание'
    - 'основание знания'
    - 'границы знания'
    - 'что мы можем знать'
  en:
    - 'knowledge'
    - 'what does it mean to know'
    - 'what is knowledge'
    - 'know for certain'
    - 'can we know for certain'
    - 'reliable knowledge'
