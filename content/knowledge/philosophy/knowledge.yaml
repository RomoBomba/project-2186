    - 'limits of knowledge'
    - 'what can we know'

summary:
  ru: >
    Знание требует большего, чем простая уверенность: необходимо основание,
    позволяющее отличить удачную догадку от обоснованного убеждения. Но любое
    основание зависит от доступных свидетельств и ограничений наблюдателя.
  en: >
    Knowledge requires more than confidence: it needs grounds that distinguish a lucky
    guess from a justified belief. Yet every ground depends on available evidence and
    the limitations of the observer.

claims:
  ru:
    - 'Уверенность сама по себе не делает убеждение знанием.'
    - 'Признание границ знания может быть частью более надёжного понимания.'
  en:
    - 'Confidence alone does not make a belief knowledge.'
    - 'Recognizing limits of knowledge may be part of more reliable understanding.'

tensions:
  ru:
    - 'Для проверки одного основания часто требуется другое основание.'
    - 'Чем выше требование к абсолютной достоверности, тем меньше утверждений можно считать знанием.'
  en:
    - 'Checking one justification often requires another justification.'
    - 'The stronger the demand for absolute certainty, the fewer claims remain eligible as knowledge.'

questions:
  ru:
    - 'Можно ли знать что-либо без возможности ошибиться?'
    - 'Что важнее: уверенность или качество основания?'
  en:
    - 'Can something be known without any possibility of error?'
    - 'What matters more: certainty or the quality of the grounds?'

