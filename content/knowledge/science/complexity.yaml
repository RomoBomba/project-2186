id: science.complexity
domain: science

title:
  ru: 'Сложность'
  en: 'Complexity'

aliases:
  ru:
    - 'сложность'
    - 'сложная система'
    - 'сложные системы'
    - 'много взаимодействующих частей'
    - 'эмерджентность'
    - 'возникающие свойства'
    - 'непредсказуемая система'
    - 'поведение системы'
  en:
    - 'complexity'
